<!DOCTYPE html>
<html>
<head>
    <title>Nike Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: url('nikewebsitedb/bg.jpg') no-repeat center/cover;
            backdrop-filter: blur(5px);
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 20px 50px;
            background: rgba(0,0,0,0.7);
            color: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }

        /* Title */
        h1 {
            text-align: center;
            margin: 30px;
            color: white;
            font-size: 40px;
        }

        /* Products */
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            padding: 20px;
        }

        .card {
            background: rgba(255,255,255,0.9);
            width: 250px;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
            text-align: center;
        }

        .card h3 {
            margin: 10px 0;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        button {
            margin-top: 10px;
            padding: 8px 15px;
            border: none;
            background: black;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: red;
        }

    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="logo">NIKE</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Login</a>
        </div>
    </div>

    <h1>Nike Shoes Collection</h1>

    <div class="container">

        <div class="card">
            <img src="nikewebsitedb/imagex1.avif">
            <div class="card-content">
                <h3>LeBron Witness IX</h3>
                <p class="price">₹8695</p>
                <button>Buy Now</button>
            </div>
        </div>

        <div class="card">
            <img src="nikewebsitedb/imagex2.avif">
            <div class="card-content">
                <h3>Nike Promina</h3>
                <p class="price">₹4995</p>
                <button>Buy Now</button>
            </div>
        </div>

        <div class="card">
            <img src="nikewebsitedb/imagex3.avif">
            <div class="card-content">
                <h3>Nike Air Max</h3>
                <p class="price">₹15995</p>
                <button>Buy Now</button>
            </div>
        </div>

    </div>

</body>
</html>
